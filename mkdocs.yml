site_name: Unreal Study
site_description: 언리얼 엔진 구조를 공부하며 정리한 기록
site_url: https://seokwon-park.github.io/UnrealStudy/
repo_url: https://github.com/Seokwon-Park/UnrealStudy
repo_name: Seokwon-Park/UnrealStudy
edit_uri: edit/main/docs/
theme:
  name: material
  language: ko
  font: false
  icon:
    logo: material/cube-outline
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: 다크 모드 }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: 라이트 모드 }
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: "#"
nav:
  - 홈: index.md
  - 코어:
      - UObject와 리플렉션: core/uobject.md
      - 가비지 컬렉션: core/garbage-collection.md
  - 게임 프레임워크:
      - Actor와 Component: gameframework/actor-component.md
      - GameMode·GameState·PlayerController: gameframework/game-framework-classes.md
  - 엔진:
      - 모듈과 빌드 시스템: engine/modules.md
      - 엔진 시작과 게임 루프: engine/engine-loop.md
  - 노트 템플릿: template.md
